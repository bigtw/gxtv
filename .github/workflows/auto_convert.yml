name: Auto Convert M3U to TXT

on:
  schedule:
    # 每天 UTC 时间 0:00（即北京时间每天上午 8:00）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 赋予 GitHub Actions 写入和提交文件的权限

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 执行转换脚本
        run: python convert.py

      - name: 提交并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.txt
          git diff-index --quiet HEAD || git commit -m "Auto update live.txt"
          git push
